.pk-pin{position:relative;width:44px;height:44px}
.pk-pin-halo{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(255,255,255,.55) 42%,rgba(255,255,255,0) 70%)}
.pk-pin-dot{position:absolute;left:50%;top:50%;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#6FB0FF,#1265DE 58%,#0A3781);border:3px solid #fff;z-index:3;
  box-shadow:0 0 0 2px rgba(18,101,222,.5),0 3px 12px rgba(13,31,51,.5)}
.pk-pin-ring{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  border:2px solid rgba(18,101,222,.45);animation:__pkPulse 2.6s ease-out infinite}
@keyframes __pkPulse{0%{transform:scale(.5);opacity:.85}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}
.leaflet-container{background:#EDF2F8}
#map::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(13,31,51,.05),inset 0 0 26px rgba(13,31,51,.07);z-index:1000}
.layer-switch{gap:1px}
.layer-btn{padding:5px 8px;font-size:11px}
.leaflet-control-scale{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#3D4E62}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;}

<style>
/* ===== 视觉系统：测绘仪表 ===== */
:root{
  --paper:#EDF2F8;
  --sheet:#FFFFFF;
  --ink:#0D1F33;
  --muted:#6B7C90;
  --line:#DAE4EF;
  --blue:#1265DE;
  --blue-soft:#E9F1FD;
  --signal:#E4502A;
  --ok:#0C9873;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(180deg,#E2EBF6 0,#EDF2F8 300px,var(--paper) 100%);
  min-height:100vh;padding-bottom:28px;max-width:560px;margin:0 auto;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:contain;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
.blob,.b1,.b2,.b3{display:none}

.app-header{display:flex;align-items:center;gap:11px;padding:18px 18px 13px}
.app-header .logo{width:32px;height:32px;border-radius:8px;overflow:hidden;flex:none;border:1px solid rgba(13,31,51,.12)}
.app-header .logo img{width:100%;height:100%;object-fit:cover;display:block}
.app-header h1{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.app-header p{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.6px}

.map-wrap{position:relative;padding:0 14px}
#map{height:44vh;min-height:262px;width:100%;border-radius:16px;border:1px solid var(--line);
  overflow:hidden;background:#DDE6F0;box-shadow:0 3px 14px rgba(13,31,51,.09);transform:translateZ(0)}
.layer-switch{position:absolute;top:11px;right:24px;z-index:1000;display:flex;gap:2px;padding:3px;
  border-radius:11px;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 2px 8px rgba(13,31,51,.1)}
.layer-btn{border:0;background:none;padding:5px 9px;border-radius:8px;font-size:11.5px;font-weight:600;
  color:#3D4E62;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .15s,color .15s}
.layer-btn.active{background:var(--blue);color:#fff}
.layer-btn:active{opacity:.78}

.map-note{position:absolute;left:24px;bottom:11px;z-index:1000;padding:6px 10px;border-radius:8px;
  background:rgba(255,255,255,.94);border:1px solid var(--line);font-size:11.5px;color:#3D4E62;
  box-shadow:0 2px 8px rgba(13,31,51,.1);pointer-events:none}
.panel{margin:14px 14px 0;background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card{padding:16px 16px 18px;border-top:1px solid var(--line)}
.card.first{border-top:0}
.card h3{font-size:13px;font-weight:600;color:#4B5D71;letter-spacing:.5px;margin-bottom:12px}

.coords{display:flex;align-items:center;min-height:46px;padding:8px 13px;margin-bottom:10px;
  border-radius:11px;background:var(--ink);color:#fff;
  font-family:var(--mono);font-size:12.5px;line-height:1.45;word-break:break-all;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.coords::before{content:"目标点位";display:inline-block;font-family:var(--sans);font-size:9.5px;
  letter-spacing:1.5px;color:rgba(255,255,255,.5);padding-right:9px;margin-right:9px;
  border-right:1px solid rgba(255,255,255,.22);vertical-align:middle}

.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row.tight{margin-top:0}
.btn{flex:1 1 0;min-width:0;padding:12px;border:1px solid transparent;border-radius:11px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(180deg,#1A6FEA 0%,#0E56C2 100%);color:#fff;
  border-color:#0C4CAB;border-radius:11px;font-size:14.5px;letter-spacing:.4px;min-height:46px;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;
  box-shadow:0 2px 6px rgba(14,86,194,.18),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:active{background:linear-gradient(180deg,#0E56C2 0%,#0A47A0 100%);
  transform:translateY(1px);box-shadow:0 1px 4px rgba(14,86,194,.16)}
.btn-primary svg{flex:none;opacity:.9;width:14px;height:14px}
.btn-secondary{background:#F3F6FA;color:#23364C;border-color:var(--line)}
.btn-secondary:active{background:#E8EEF6}
.btn-danger{background:#fff;color:var(--signal);border-color:#F1C8BA}
.btn-danger:active{background:#FDF2EE}
.btn-success{background:var(--ok);color:#fff}
.btn-sm{flex:none;padding:8px 13px;font-size:12px;border-radius:9px}
.btn-chip{background:#F3F6FA;color:#23364C;border-color:var(--line);font-size:13px;padding:11px 0}

.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
  font-size:16px;font-family:var(--mono);color:var(--ink);outline:0;background:#F8FAFD;
  transition:border-color .18s,background .18s,box-shadow .18s}
.input-row input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(18,101,222,.13)}
.input-row input::placeholder{color:#9AAABB;font-family:var(--sans);font-size:14px}

<script>
/* 锁定页面缩放：iOS Safari 会忽略 user-scalable=no，这里用事件拦截兜底 */
(function () {
  var block = function (e) { e.preventDefault(); };
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  document.addEventListener('gestureend', block, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  var lastTap = 0;
  document.addEventListener('touchend', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('#map')) return;
    var now = Date.now();
    if (now - lastTap < 320) e.preventDefault();
    lastTap = now;
  }, { passive: false });
})();
</script>

})();

var GCJ_A = 6378245.0, GCJ_EE = 0.00669342162296594323;
function gcjOutOfChina(lng, la) {
  return lng < 72.004 || lng > 137.8347 || la < 0.8293 || la > 55.8271;
}
function gcjDeltaLat(x, y) {
  var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  r += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
  r += ((20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin((y / 3.0) * Math.PI)) * 2.0) / 3.0;
  r += ((160.0 * Math.sin((y / 12.0) * Math.PI) + 320 * Math.sin((y * Math.PI) / 30.0)) * 2.0) / 3.0;
  return r;
}
function gcjDeltaLon(x, y) {
  var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  r += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
  r += ((20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin((x / 3.0) * Math.PI)) * 2.0) / 3.0;
  r += ((150.0 * Math.sin((x / 12.0) * Math.PI) + 300.0 * Math.sin((x / 30.0) * Math.PI)) * 2.0) / 3.0;
  return r;
}
function wgs84ToGcj02(lat, lon) {
  if (gcjOutOfChina(lon, lat)) return { lat: lat, lon: lon };
  var dLat = gcjDeltaLat(lon - 105.0, lat - 35.0);
  var dLon = gcjDeltaLon(lon - 105.0, lat - 35.0);
  var radLat = (lat / 180.0) * Math.PI;
  var magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / (((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic)) * Math.PI);
  dLon = (dLon * 180.0) / ((GCJ_A / sqrtMagic) * Math.cos(radLat) * Math.PI);
  return { lat: lat + dLat, lon: lon + dLon };
}
function gcj02ToWgs84(lat, lon) {
  if (gcjOutOfChina(lon, lat)) return { lat: lat, lon: lon };
  var wgsLat = lat, wgsLon = lon;
  for (var i = 0; i < 6; i++) {
    var g = wgs84ToGcj02(wgsLat, wgsLon);
    var errLat = g.lat - lat, errLon = g.lon - lon;
    if (Math.abs(errLat) < 1e-9 && Math.abs(errLon) < 1e-9) break;
    wgsLat -= errLat;
    wgsLon -= errLon;
  }
  return { lat: wgsLat, lon: wgsLon };
}

const SAVE_API = 'https://gs-loc.apple.com/ils-settings/save';
const ELEV_API = 'https://api.open-meteo.com/v1/elevation';
const FAV_KEY = 'loc_favorites';
// 写入设备的精度参数 (固定值)
const WRITE_HACC = 39, WRITE_VACC = 1000, WRITE_JITTER = 0;
let lat = 30.503610, lon = 117.049305;
let selected = false;

/* ---- 海拔: 后台静默查询, 只随写入请求发出, 界面不显示 ----
   Open-Meteo 偶尔要 2 秒以上, 所以结果按坐标缓存, 常用地点第二次就是瞬时的。 */
const elevCache = new Map();
let elev = null, elevSeq = 0, elevTimer = null, elevPromise = null;
function elevKey(la, lo) { return la.toFixed(4) + ',' + lo.toFixed(4); }
function elevFrom(d) {
  return (d && d.elevation && d.elevation.length && d.elevation[0] !== null) ? Math.round(d.elevation[0]) : null;
}
// 只填缓存, 不动当前选中点的 elev —— 用于页面加载时预热几个常用地点
function prefetchElev(la, lo) {
  const key = elevKey(la, lo);
  if (elevCache.has(key)) return;
  fetch(ELEV_API + '?latitude=' + la + '&longitude=' + lo, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { elevCache.set(key, elevFrom(d)); })
    .catch(function () {});
}
function fetchElev(la, lo) {
  const key = elevKey(la, lo);
  const seq = ++elevSeq;
  clearTimeout(elevTimer);
  if (elevCache.has(key)) { elev = elevCache.get(key); elevPromise = Promise.resolve(); return; }
  elev = null;
  elevPromise = new Promise(function (resolve) {
    elevTimer = setTimeout(function () {
      fetch(ELEV_API + '?latitude=' + la + '&longitude=' + lo, { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          const v = elevFrom(d);
          elevCache.set(key, v);
          if (seq === elevSeq) elev = v;
        })
        .catch(function () { if (seq === elevSeq) elev = null; })
        .then(resolve);
    }, 250);
  });
}

function toDisplay(la, lo) { return layerIsGcj ? wgs84ToGcj02(la, lo) : { lat: la, lon: lo }; }
function fromDisplay(la, lo) { return layerIsGcj ? gcj02ToWgs84(la, lo) : { lat: la, lon: lo }; }

const map = L.map('map', { attributionControl: false }).setView([toDisplay(lat, lon).lat, toDisplay(lat, lon).lon], 15);
const tiles = {
  satellite: L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {maxZoom:18, subdomains:'1234', attribution:'\u00a9 高德'}),
  wgs84: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'ArcGIS WGS84'}),
  standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'}),

  amap: L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=2&style=8&x={x}&y={y}&z={z}', {maxZoom:18, subdomains:'1234', attribution:'© 高德'}),
  tdt: L.layerGroup([
    L.tileLayer('https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=ba633f5fc1494c7e40f3f6af15481a86', {maxZoom:18, subdomains:'01234567', attribution:'\u00a9 \u5929\u5730\u56fe'}),
    L.tileLayer('https://t{s}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=ba633f5fc1494c7e40f3f6af15481a86', {maxZoom:18, subdomains:'01234567'})
  ]),
  voyager: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {maxZoom:19, attribution:'© Carto'})
};
let currentLayer = tiles.amap;
currentLayer.addTo(map);
function switchLayer(name) {
  map.removeLayer(currentLayer);
  currentLayer = tiles[name];
  currentLayer.addTo(map);
  layerIsGcj = (name === 'amap' || name === 'satellite');
  const d = toDisplay(lat, lon);
  marker.setLatLng([d.lat, d.lon]);

  document.querySelectorAll('.layer-btn').forEach(b => b.classList.toggle('active', b.dataset.layer === name));
}
let marker = L.marker([toDisplay(lat, lon).lat, toDisplay(lat, lon).lon], {draggable:true}).addTo(map);
marker.on('dragend', e => { const p=e.target.getLatLng(); setPosFromDisplay(p.lat, p.lng); });
map.on('click', e => { setPosFromDisplay(e.latlng.lat, e.latlng.lng); });

function setPosFromDisplay(dLat, dLon) {

}
function setPos(newLat, newLon) {
  lat = newLat; lon = newLon; selected = true;

  marker.setLatLng([d.lat, d.lon]);
  document.getElementById('coords').textContent = '经度 ' + lon.toFixed(6) + '  纬度 ' + lat.toFixed(6);
  fetchElev(lat, lon);
}
function moveTo(newLat, newLon, zoom) {

}
function toast(msg, ms) {

// 网络不通时显示「无法使用，请关闭浏览器🤪」横幅

/* ---- Favorites (localStorage) ---- */
function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) { return []; }
}
function saveFavs(favs) {
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
}
function renderFavs() {
  const favs = getFavs();
  const el = document.getElementById('favList');
  const clearBtn = document.getElementById('clearAllBtn');
  clearBtn.style.display = favs.length ? '' : 'none';
  if (!favs.length) {
    el.innerHTML = '<div class="fav-empty">暂无收藏，选好位置后点击「收藏位置」</div>';
    return;
  }
  el.innerHTML = favs.map((f, i) => {
    const isActive = activeLon !== null && Math.abs(f.lon - activeLon) < 0.000001 && Math.abs(f.lat - activeLat) < 0.000001;
    return '<div class="fav-item" onclick="loadFav(' + i + ')">' +
      '<div class="fav-info">' +
        '<div class="fav-name">' + escHtml(f.name) + '<\/div>' +
        '<div class="fav-coords">' + f.lon.toFixed(6) + ', ' + f.lat.toFixed(6) + '<\/div>' +
        (isActive ? '<div class="fav-active">✓ 当前生效<\/div>' : '') +
      '<\/div>' +
      '<button class="fav-del" onclick="event.stopPropagation();delFav(' + i + ')" title="删除">×<\/button>' +
    '<\/div>';
  }).join('');
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function addFav() {
  if (!selected) { toast('请先在地图上选择一个位置'); return; }
  document.getElementById('favModalCoords').textContent = lon.toFixed(6) + ', ' + lat.toFixed(6);
  document.getElementById('favNameInput').value = '';
  document.getElementById('favModal').classList.add('show');
  setTimeout(() => document.getElementById('favNameInput').focus(), 100);
}
function closeFavModal() {
  document.getElementById('favModal').classList.remove('show');
}
function confirmFav() {
  const name = document.getElementById('favNameInput').value.trim();
  if (!name) { toast('请输入备注名称'); return; }
  const favs = getFavs();
  favs.push({ name, lon, lat, time: new Date().toISOString() });
  saveFavs(favs);
  closeFavModal();
  renderFavs();
  toast('已收藏: ' + name);
}

// 通用确认弹窗: 替代原生 confirm (原生弹窗顶部会显示网页网址, 无法隐藏)
var confirmAction = null;
function showConfirm(msg, fn) {
  document.getElementById('confirmMsg').textContent = msg;

  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm() {

  document.getElementById('confirmModal').classList.remove('show');
}
function okConfirm() {

}
function loadFav(i) {
  const favs = getFavs();
  if (!favs[i]) return;
  moveTo(favs[i].lat, favs[i].lon, 15);
  toast(favs[i].name + ' (' + favs[i].lon.toFixed(4) + ', ' + favs[i].lat.toFixed(4) + ')');
}
function delFav(i) {
  const favs = getFavs();
  if (!favs[i]) return;
  const name = favs[i].name;
  favs.splice(i, 1);
  saveFavs(favs);
  renderFavs();

}
function clearAllFav() {

/* ---- Active location query ---- */
function queryActive() {
  const el = document.getElementById('activeValue');
  el.textContent = '查询中...';
  setNetBanner('checking');
  fetch(SAVE_API + '?action=query', { method:'GET', mode:'cors', cache:'no-store' })
    .then(r => r.json())
    .then(d => {
      setNetBanner('ok');
      if (d.success && d.longitude && d.latitude) {
        activeLon = parseFloat(d.longitude);
        activeLat = parseFloat(d.latitude);
        const hac = (d.horizontalAccuracy != null ? d.horizontalAccuracy : d.accuracy);
        const rr = d.randomRadius || 0;
        el.textContent = '经度 ' + activeLon.toFixed(6) + '  纬度 ' + activeLat.toFixed(6) + (hac ? '  精度 ' + hac + 'm' : '') + (rr ? '  扰动 ' + rr + 'm' : '');
        renderFavs();
      } else {
        activeLon = null; activeLat = null;
        el.textContent = '无已保存的坐标';
        renderFavs();
      }
    })
    .catch(() => {
      setNetBanner('bad');
      el.textContent = '查询失败';
    });
}
function clearActive() {
  showConfirm('确定清除设备上已保存的坐标？清除后将使用模块默认参数或停止修改定位。', function () {
    fetch(SAVE_API + '?action=clear', { method:'GET', mode:'cors', cache:'no-store' })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          activeLon = null; activeLat = null;
          document.getElementById('activeValue').textContent = '已清除';
          renderFavs();
          toast('已清除设备坐标');
        } else { toast('清除失败: ' + (d.error || ''), 3000); }
      })
      .catch(() => { toast('清除失败 - 请检查模块配置', 3000); });
  });
}

/* ---- Save to device ---- */
async function save() {
  if (!selected) { toast('请先在地图上选择一个位置'); return; }
  const btn = document.getElementById('saveBtn');
  btn.textContent = '储存中...'; btn.disabled = true;
  setNetBanner('checking');
  try {
    // 海拔是后台异步查的, 最多等 3 秒; 查不到就不带这个参数 (模块会用默认值)
    if (elevPromise) await Promise.race([elevPromise, new Promise(r => setTimeout(r, 3000))]);
    let url = SAVE_API + '?lon=' + lon + '&lat=' + lat;
    if (elev !== null) url += '&alt=' + elev;
    url += '&hacc=' + WRITE_HACC + '&vacc=' + WRITE_VACC + '&randomRadius=' + WRITE_JITTER;
    const r = await fetch(url, {
      method: 'GET', mode: 'cors', cache: 'no-store'
    });
    const d = await r.json();
    if (d.success) {
      setNetBanner('ok');
      activeLon = lon; activeLat = lat;
      btn.textContent = '✓ 已储存'; btn.className = 'btn btn-primary success';
      document.getElementById('status').textContent = '✓ 已写入: ' + lon.toFixed(6) + ', ' + lat.toFixed(6) + ' · ' + new Date().toLocaleTimeString('zh-CN');
      document.getElementById('activeValue').textContent = '经度 ' + lon.toFixed(6) + '  纬度 ' + lat.toFixed(6) + '  精度 ' + WRITE_HACC + 'm';
      renderFavs();
      toast('✓ 坐标已写入设备，下次定位生效');
      setTimeout(() => { btn.textContent='储存到设备'; btn.className='btn btn-primary'; btn.disabled=false; }, 2500);
    } else {
      throw new Error(d.error || '写入失败');
    }
  } catch(e) {
    btn.textContent = '储存到设备'; btn.className = 'btn btn-primary'; btn.disabled = false;
    setNetBanner('bad');
    toast('✗ 储存失败 - 请检查模块配置', 4000);
  }
}

// 当前位置: 取设备真实定位（不走模块回退，避免不同域名拿到不同数据）
function locateMe() {
  toast('获取位置中...');
  const geo = navigator.geolocation;
  if (!geo) { toast('此浏览器不支持定位', 3000); return; }
  geo.getCurrentPosition(
    pos => { moveTo(pos.coords.latitude, pos.coords.longitude, 16); toast('已获取当前位置'); },
    err => {
      const code = err && err.code;
      if (code === 1) toast('定位权限被拒：设置 → Safari 浏览器 → 位置，改成“允许”', 6000);
      else if (code === 2) toast('位置不可用：请打开系统“定位服务”', 5000);
      else if (code === 3) toast('定位超时，请再点一次', 4000);
      else toast('定位失败: ' + (err && err.message ? err.message : '未知错误'), 3000);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}
// 回退: 读取模块当前生效坐标作为当前位置(IP 估算会定位到代理出口, 不可靠, 已弃用)
function locateFromModule() {
  fetch(SAVE_API + '?action=query', { method:'GET', mode:'cors', cache:'no-store' })
    .then(r => r.json())
    .then(d => {
      if (d.success && d.longitude && d.latitude) {
        moveTo(parseFloat(d.latitude), parseFloat(d.longitude), 16);
        toast('已定位到设备已存坐标');
      } else {
        toast('无法获取当前位置，请先储存一个位置或开启定位模块', 4000);
      }
    })
    .catch(() => { toast('无法获取当前位置，请开启定位模块', 4000); });
}

// 三处打卡地点以加密字符串存储, 运行时解析 —— 避免在源码中直接暴露坐标
const PLACES = JSON.parse('[{"name":"总部","lat":30.513168,"lon":117.031338},{"name":"北区","lat":30.548697,"lon":117.058331},{"name":"东区","lat":30.519090,"lon":117.114172}]');

function locateInput() {
  const lon = parseFloat(document.getElementById('lonInput').value);
  const lat = parseFloat(document.getElementById('latInput').value);
  if (isNaN(lon) || isNaN(lat)) return toast('请输入正确的经纬度', 3000);
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return toast('数值超出范围', 3000);
  moveTo(lat, lon, 16);
  toast('已定位: 经度 ' + lon.toFixed(6) + ' 纬度 ' + lat.toFixed(6));
}

function searchCoords() {
  const text = document.getElementById('coordSearchInput').value.trim();
  if (!text) return toast('请输入经纬度');
  const m = text.match(/(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) return toast('格式错误，示例: 121.4737, 31.2304', 3000);
  const a = parseFloat(m[1]), b = parseFloat(m[2]);
  let la, lo;
  if (Math.abs(a) <= 90 && Math.abs(b) > 90) { la = a; lo = b; }
  else if (Math.abs(b) <= 90 && Math.abs(a) > 90) { la = b; lo = a; }
  else { la = a; lo = b; }
  moveTo(la, lo, 15);
  toast('已定位: 经度 ' + lo.toFixed(6) + ' 纬度 ' + la.toFixed(6));
}

// 页面加载: 静默定位到当前位置, 不改动坐标显示文字
(function(){
  var geo = navigator.geolocation;
  if (!geo) return;

<script>
/* 地图换肤：中文矢量/极简浅灰/暗色三套免密钥底图 + 比例尺；原有坐标系换算与交互全部保留 */
(function(){
  var V = window.__pkV; if(!V||!V.map) return;
  var map = V.map;
  function find(part){ for(var i=0;i<V.layers.length;i++){ if(V.layers[i].url.indexOf(part)>-1) return V.layers[i].layer; } return null; }

  /* 高德：卫星图 → 矢量图（中文注记、浅色底、道路分级清晰），仍为 GCJ-02 图源 */
  var amap = find('webrd');
  if(amap && amap._url && amap._url.indexOf('style=6')>-1){
    amap.setUrl('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=2&style=8&x={x}&y={y}&z={z}');
  }

  /* 底图自愈：高德瓦片被网络拦截/加载不出时，自动换成 Esri 浅灰底图，避免整块空白 */
  var amapErr = 0, amapOk = 0, healed = false;
  function healBase(){
    if(healed) return; healed = true;
    try{
      if(typeof window.switchLayer === 'function'){ window.switchLayer('positron'); }
      else { if(amap) map.removeLayer(amap); positron.addTo(map); }
    }catch(e){}
    try{ toast('底图加载不出来，已自动切到薄荷底图'); }catch(e){}
  }
  if(amap){
    amap.on('tileload', function(){ amapOk++; });
    amap.on('tileerror', function(){ amapErr++; if(amapErr >= 4 && amapOk === 0) healBase(); });
    setTimeout(function(){ if(amapOk === 0 && map.hasLayer(amap)) healBase(); }, 9000);
  }

  /* 定位兜底：浏览器拒绝授权时改用网络定位，避免“定位权限被拒”卡死 */
  function homePin(){
    try{ if(typeof PLACES !== 'undefined' && PLACES && PLACES[0]) return PLACES[0]; }catch(e){}
    return null;
  }
  function netLocate(){
    return fetch('/api/ipgeo?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var home = homePin();
        /* 走代理时网络定位会落在节点所在地，与收藏点偏差过大就不用它 */
        if(d && d.ok && home){
          var dLat = Math.abs(d.lat - home.lat), dLon = Math.abs(d.lon - home.lon);
          if(dLat > 2.7 || dLon > 2.7){
            try{ moveTo(home.lat, home.lon, 13); }catch(e){ return false; }
            try{ toast('定位权限被拒，已先用收藏的「' + (home.name || '常用点') + '」坐标占位，可手动改'); }catch(e){}
            return true;
          }
        }
        if(d && d.ok){
          try{ moveTo(d.lat, d.lon, 12); }catch(e){ return false; }
          try{ toast('定位权限被拒，已用网络定位（' + (d.city || d.region || '附近') + '）'); }catch(e){}
          return true;
        }
        if(home){
          try{ moveTo(home.lat, home.lon, 13); }catch(e){ return false; }
          try{ toast('定位权限被拒，已先用收藏的「' + (home.name || '常用点') + '」坐标占位'); }catch(e){}
          return true;
        }
        return false;
      })
      .catch(function(){
        var home = homePin();
        if(!home) return false;
        try{ moveTo(home.lat, home.lon, 13); }catch(e){ return false; }
        try{ toast('定位权限被拒，已先用收藏的「' + (home.name || '常用点') + '」坐标占位'); }catch(e){}
        return true;
      });
  }
  try{
    var _g = navigator.geolocation;
    if(_g && _g.getCurrentPosition){
      var _ogc = _g.getCurrentPosition.bind(_g);
      _g.getCurrentPosition = function(ok, bad, opt){
        _ogc(ok, function(e){
          if(e && e.code === 1){ netLocate().then(function(f){ if(!f && typeof bad === 'function') bad(e); }); return; }
          if(typeof bad === 'function') bad(e);
        }, opt);
      };
    }
  }catch(e){}
  /* 页面一加载就已被拒绝（不会再弹窗）时，直接走网络定位 */
  try{
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(function(st){
        var chk = function(){ if(st.state === 'denied') netLocate(); };
        try{ st.onchange = chk; }catch(e){}
        chk();
      }).catch(function(){});
    }
  }catch(e){}

  /* 「极简」「暗色」：都用高德高清矢量做底 + CSS 滤镜调色，
     好处是地名还是中文、坐标还是 GCJ、字号和道路都清晰不糊 */
  var VEC_URL = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=2&style=8&x={x}&y={y}&z={z}';
  function skinPane(id, filter){
    var pn = map.createPane(id);
    pn.style.zIndex = 250;
    pn.style.filter = filter;
    return pn;
  }
  skinPane('tnGray', 'hue-rotate(-45deg) saturate(.7) brightness(1.02) sepia(.12)'); /* 青瓷：暖沙陆地+青瓷江面 */
  skinPane('tnDark', 'invert(1) grayscale(1) brightness(1.12) contrast(.94)');          /* 夜间：纯石墨 */
  var PAPER_URL = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}';
  var positron = L.tileLayer(VEC_URL, {maxZoom:18, subdomains:'1234', pane:'tnGray', attribution:''});
  var darkSkin = L.tileLayer(VEC_URL, {maxZoom:18, subdomains:'1234', pane:'tnDark', attribution:''});
  V.positron = positron; V.darkSkin = darkSkin;

  try{ L.control.scale({imperial:false, position:'bottomright', maxWidth:110}).addTo(map); }catch(e){}

  /* 图钉换成蓝宝石光点 + 呼吸圈（不论原标记是怎么创建的，统一替换） */
  try{ map.eachLayer(function(l){ if(l && l instanceof L.Marker && l.setIcon) l.setIcon(V.icon); }); }catch(e){}

  var standard = find('openstreetmap');
  var orig = window.switchLayer;
  var amapBase = find('webrd');
  var skinLayer = null;                     /* 当前挂着的皮肤层（极简 / 暗色） */
  function active(name){ var bs=document.querySelectorAll('.layer-btn'); for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('active', bs[i].getAttribute('data-layer')===name); } }
  function useSkin(layer, name){
    orig('amap');                            /* 借道原切换：坐标系判定为 GCJ、marker 自动归位 */
    if(amapBase && map.hasLayer(amapBase)) map.removeLayer(amapBase);
    if(skinLayer && map.hasLayer(skinLayer)) map.removeLayer(skinLayer);
    skinLayer = layer;
    layer.addTo(map);
    active(name);
  }
  if(typeof orig === 'function'){
    window.switchLayer = function(name){
      if(name === 'positron'){ useSkin(positron, 'positron'); return; }
      if(name === 'dark'){ useSkin(darkSkin, 'dark'); return; }
      if(skinLayer && map.hasLayer(skinLayer)) map.removeLayer(skinLayer);
      orig(name);
      active(name);
    };
  }
})();
</script>
